name: 发布正式版本

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的正式版本标签，例如 v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出标签对应的内容
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: 校验版本并提取发布说明
        run: |
          python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path
          import re

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)', tag):
              raise SystemExit('标签必须为正式版本号，例如 v1.0.0')

          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = list(re.finditer(r'^## (.+)$', text, re.MULTILINE))
          matches = [i for i, section in enumerate(sections)
                     if section.group(1).startswith(f'[{tag[1:]}]')]
          if len(matches) != 1:
              raise SystemExit('发布说明必须包含且仅包含一个对应版本条目')

          index = matches[0]
          heading = sections[index]
          date = re.fullmatch(r'\[' + re.escape(tag[1:]) + r'\] - (\d{4}-\d{2}-\d{2})', heading.group(1))
          if date is None:
              raise SystemExit('版本标题必须为 ## [版本号] - YYYY-MM-DD')
          datetime.date.fromisoformat(date.group(1))
          end = sections[index + 1].start() if index + 1 < len(sections) else len(text)
          notes = text[heading.end():end].strip()
          if not notes:
              raise SystemExit('对应版本的发布说明不能为空')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(notes + '\n', encoding='utf-8')
          print(f'已校验 {tag} 的发布说明')
          PY

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json body,isDraft > "$RUNNER_TEMP/existing-release.json"; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((folder / 'existing-release.json').read_text(encoding='utf-8'))
          expected = (folder / 'release-notes.md').read_text(encoding='utf-8').strip()
          if release['isDraft'] or release['body'].strip() != expected:
              raise SystemExit('已有 Release 未正式发布或说明不一致，停止操作以保护已发布内容')
          print('对应版本已发布且说明一致，无需重复创建')
          PY
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
